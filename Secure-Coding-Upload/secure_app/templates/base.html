<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Utility - Hardened Production</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f1f5f9; margin: 0; padding: 0; line-height: 1.5; }
        nav { background: #0f172a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .brand { font-size: 1.15rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 1.25rem; font-size: 0.95rem; font-weight: 500; }
        .nav-links a:hover { color: #38bdf8; }
        .container { max-width: 850px; margin: 2.5rem auto; padding: 2rem; background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        .btn { background: #0284c7; color: white; border: none; padding: 0.65rem 1.4rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: background 0.15s; }
        .btn:hover { background: #0369a1; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 0.65rem; margin: 0.5rem 0 1.25rem 0; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; }
        .alert-error { background: #450a0a; color: #fca5a5; padding: 0.85rem; border-radius: 6px; border: 1px solid #7f1d1d; margin-bottom: 1.25rem; }
        .alert-success { background: #052e16; color: #86efac; padding: 0.85rem; border-radius: 6px; border: 1px solid #14532d; margin-bottom: 1.25rem; }
        .badge-secure { background: #064e3b; color: #6ee7b7; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>
    <nav>
        <div class="brand">
            <span>🛡️ CyberShield Utility</span>
            <span class="badge-secure">OWASP Hardened</span>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/check-password">Password Checker</a>
            <a href="/check-url">URL / Phishing Scanner</a>
            {% if session.get('user') %}
                <a href="/dashboard">Dashboard ({{ session['user'] }})</a>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
