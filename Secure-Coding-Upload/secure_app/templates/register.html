{% extends "base.html" %}
{% block content %}
<h2>Create Secure Account</h2>
<p style="color: #94a3b8; font-size: 0.9rem;">Passwords are salted and hashed using scrypt (RFC 7914).</p>

{% if error %}
<div class="alert-error">{{ error }}</div>
{% endif %}

<form method="POST" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <label>Username (min 3 chars, alphanumeric)</label>
    <input type="text" name="username" required>
    
    <label>Email Address</label>
    <input type="email" name="email" required>
    
    <label>Password (min 10 characters)</label>
    <input type="password" name="password" minlength="10" required>
    
    <button type="submit" class="btn">Register Account</button>
</form>
{% endblock %}
