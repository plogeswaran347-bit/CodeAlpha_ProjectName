{% extends "base.html" %}
{% block content %}
<h2>Password Strength Checker (Vulnerable to XSS)</h2>
<p style="color: #94a3b8;">Try XSS payload: <code>&lt;script&gt;alert('XSS')&lt;/script&gt;</code></p>

<form method="POST" action="/check-password">
    <label>Test Password</label>
    <input type="text" name="password" placeholder="Enter password to test..." required>
    
    <button type="submit" class="btn">Analyze Strength</button>
</form>
{% endblock %}
